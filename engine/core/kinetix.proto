syntax = "proto3";

package kinetix;

// ==========================================
// 2. METADATA & SYSTEM MONITORING
// ==========================================

message HostInfo {
  string id = 1;            // HEX ID
  string os = 2;            // "Linux", "Windows", etc.
  string ip = 3;            // Internal IP
  string mac = 4;
}

message SystemStatus {
  string cpu = 1;          // e.g., "100%"
  string ram = 2;          // e.g., "100%"
  string gpu = 3;          // e.g., "100%"
  string disk = 4;         // e.g., "100%"
}

// ==========================================
// 3. HOST EVENT TYPES (Timestamps are in KinetixPacket)
// ==========================================

message ProcessStart {
  string process = 1;
  string path = 2;
  string sha256 = 3;
  string cmdline = 4;
  string parent = 5;
  string parent_path = 6;
  string parent_sha256 = 7;
  string user = 8;
  string cpu = 9;
  string gpu = 10;
  string ram = 11;
  string disk = 12;
}

message ProcessKill {
  string process = 1;
  string path = 2;
  string sha256 = 3;
  string term_type = 4;
  string exit_code = 5;
}

message FileEvent {
  string file_type = 1;    // e.g., ".exe"
  string path = 2;
  string size = 3;
  string process = 4;
  string user = 5;
  string owner = 6;
  string hash = 7;
  string op_type = 8;      // "create", "modify", "delete"
  string size_change = 9;
  string perm_change = 10;
}

message ServiceEvent {
  string name = 1;
  string path = 2;
  string account = 3;
  string op_type = 4;      // "create", "delete", "modified"
  string start_type = 5;
  string user = 6;
  string creator = 7;
  string deleter = 8;
}

message RegistryEvent {
  string op_type = 1;      // "create", "set", "delete"
  string reg_path = 2;
  string reg_val = 3;
  string reg_type = 4;
  string reg_user = 5;
  string reg_owner = 6;
  string reg_perm = 7;
}

message NetworkConnection {
  string process = 1;
  string protocol = 2;
  bool ip_local = 3;
  string dst_ip = 4;
  string src_port = 5;
  string dst_port = 6;
  string sent = 7;
  string recv = 8;
}

message DnsQuery {
  string q_name = 1;
  string q_type = 2;
  string q_res = 3;
  string q_port = 4;
  string q_proto = 5;
}

message SessionEvent {
  string session_id = 1;
  string user = 2;
  string status = 3;       // "Start", "End"
  string logon_type = 4;
  string source_network_address = 5;
}

message ConsoleLogin {
  string user = 1;
  string action = 2;       // "Login", "Logout"
  string method = 3;
  string terminal = 4;
  string result = 5;
}

message AuthLogin {
  string user = 1;
  string domain = 2;
  string src_ip = 3;
  string logon_type = 4;
  string auth_package = 5;
  string result = 6;
  string failure_reason = 7;
}

message ScheduledTask {
  string task_name = 1;
  string action = 2;
  string path = 3;
  string user = 4;
}

message AccountManagement {
  string action = 1;
  string target_user = 2;
  string subject_user = 3;
  string domain = 4;
}

message GroupManagement {
  string action = 1;
  string group_name = 2;
  string member_user = 3;
  string subject_user = 4;
}

message ModuleLoad {
  string process = 1;
  string image_path = 2;
  string sha256 = 3;
  string signed = 4;
}

message PipeEvent {
  string pipe_name = 1;
  string op_type = 2;
  string process = 3;
  string handle_id = 4;
}

message WmiEvent {
  string query = 1;
  string user = 2;
  string namespace = 3;
}

// ==========================================
// 4. NETWORK (L2/L3) INFRASTRUCTURE EVENTS
// ==========================================

message TrafficEvent {
  string src_ip = 1;
  string dst_ip = 2;
  string src_mac = 3;
  string dst_mac = 4;
  string src_port = 5;
  string dst_port = 6;
  string proto = 7;
  string action = 8;
  string src_iface = 9;
  string dst_iface = 10;
  string vlan_src = 11;
  string vlan_dst = 12;
}

// ==========================================
// 5. THE ATOMIC PACKET (ROOT BUNDLE)
// ==========================================

message KinetixPacket {
  // 1. UNIFIED CORRELATION ID
  string uuid = 2;

  // 3. AI OUTCOMES
  string ai_verdict = 3;
  float ai_anomaly_score = 4;

  // 4. TIMESTAMPS
  string server_ts = 5;      // Injected by the Brain (ISO-8601 Format)
  string timestamp_ref = 6;  // Injected by the Agent (ISO-8601 Format)

  // 5. CONTEXT
  string role = 7;         
  
  // 6. TELEMETRY
  HostInfo host = 8;       
  SystemStatus status = 9; 

  // 7. THE LOG EVENT WRAPPER
  message Event {
    string type = 1;       // e.g. "process_start"
    oneof details {
      ProcessStart process_start = 2;
      ProcessKill process_kill = 3;
      FileEvent file_event = 4;
      ServiceEvent service_event = 5;
      RegistryEvent registry_event = 6;
      NetworkConnection network_conn = 7;
      DnsQuery dns_query = 8;
      SessionEvent session = 9;
      ConsoleLogin console_login = 10;
      AuthLogin auth_login = 11;
      ScheduledTask scheduled_task = 12;
      AccountManagement account_mgmt = 13;
      GroupManagement group_mgmt = 14;
      ModuleLoad module_load = 15;
      PipeEvent pipe_event = 16;
      WmiEvent wmi_event = 17;
      TrafficEvent traffic = 18;
    }
  }

  // 8. THE ATOMIC PAYLOAD (Log OR Registration Management)
  oneof payload {
    Event event = 10;
  }
}
