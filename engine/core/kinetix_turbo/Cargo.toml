[package]
name = "kinetix_turbo"
version = "0.1.0"
edition = "2021"

[lib]
name = "kinetix_turbo"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py310"] }
prost = "0.12"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
prost-build = "0.12"
